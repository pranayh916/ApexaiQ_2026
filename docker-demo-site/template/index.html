<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dockerized Python Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2.5rem 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
        }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; }
        p { color: #94a3b8; }
        code {
            background: #0f172a;
            padding: 2px 8px;
            border-radius: 6px;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🐳 Hello from Docker!</h1>
        <p>This small Python (Flask) website is running inside a container.</p>
        <p>Container hostname: <code>{{ hostname }}</code></p>
        <p>Server time: <code>{{ now }}</code></p>
    </div>
</body>
</html>
